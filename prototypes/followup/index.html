<div class="strip">
  <p class="strip-l"><span class="lg">FollowUp · Working prototype · Sample data</span><span class="sm">Prototype · Sample data</span></p>
  <p class="strip-r"><button type="button" class="textbtn" data-act="reset"><span class="lg">Reset demo</span><span class="sm">Reset</span></button><a href="/followup"><span class="lg">Back to case study</span><span class="sm">Case study</span></a></p>
</div>

<div class="app" id="app">
  <header class="mtop">
    <p class="logo"><svg class="logo-mark" width="28" height="28" viewBox="0 0 30 30" aria-hidden="true" focusable="false"><rect width="30" height="30" rx="8" fill="#6739F5"/><g transform="translate(5.7 5.7) scale(.775)"><path fill="#fff" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g></svg><span>FollowUp</span></p>
    <button type="button" class="menubtn" data-act="menu" aria-expanded="false" aria-controls="side"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg><span data-menu-label>Home</span></button>
  </header>

  <nav class="side" id="side" aria-label="FollowUp">
    <div class="side-top">
      <p class="logo"><svg class="logo-mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" focusable="false"><rect width="30" height="30" rx="8" fill="#6739F5"/><g transform="translate(5.7 5.7) scale(.775)"><path fill="#fff" d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></g></svg><span>FollowUp</span></p>
      <button type="button" class="side-close" data-act="menu" aria-label="Close menu"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <ul class="nav">
      <li><button type="button" data-nav="home"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button></li>
      <li><button type="button" data-nav="contacts"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg><span>Contacts</span></button></li>
      <li><button type="button" data-nav="deals"><svg class="ic" aria-hidden="true"><use href="#i-briefcase"/></svg><span>Deals</span></button></li>
      <li><button type="button" data-nav="reports"><svg class="ic" aria-hidden="true"><use href="#i-chart"/></svg><span>Reports</span></button></li>
    </ul>
    <button type="button" class="nav-settings" data-nav="settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg><span>Settings</span></button>
  </nav>

  <main class="main" id="main">
    <div class="top">
      <div class="search" id="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Search contacts, deals, or notes…" aria-label="Search contacts, deals, or notes" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="qResults" aria-autocomplete="list">
        <kbd class="search-k" aria-hidden="true">/</kbd>
        <div class="qres" id="qResults" role="listbox" aria-label="Search results" hidden></div>
      </div>
      <button type="button" class="iconbtn" data-act="bell" aria-label="Reminders" aria-haspopup="true" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg><span class="bell-dot" hidden></span></button>
      <span class="me" role="img" aria-label="Signed in as Kristena Bingham">KB</span>
    </div>
    <div class="view" id="view" tabindex="-1"></div>
  </main>

  <div class="scrim" data-act="panel-close" aria-hidden="true"></div>
  <aside class="panel" id="panel" aria-label="Contact details" tabindex="-1"></aside>
</div>

<dialog class="dlg dlg-log" id="logDlg" aria-labelledby="logTitle">
  <form class="log" id="logForm" novalidate>
    <button type="button" class="log-cancel" data-act="log-cancel">Cancel</button>
    <h2 class="log-title" id="logTitle">Log interaction</h2>
    <label class="sr-only" for="logInput">What happened?</label>
    <textarea class="log-input" id="logInput" rows="4" spellcheck="true" autocomplete="off" autocapitalize="sentences" aria-describedby="logHint" placeholder="Spoke with Dane about the new pricing. Send him a proposal and follow up next week."></textarea>
    <div class="log-types" role="radiogroup" aria-label="Interaction type" id="logTypes"></div>
    <p class="log-ai"><svg class="ic" aria-hidden="true"><use href="#i-sparkles"/></svg><span>AI will extract:</span></p>
    <div class="log-fields" id="logFields" aria-live="polite"></div>
    <div class="log-also" id="logAlso"></div>
    <button type="submit" class="btn-primary log-save">Save to CRM</button>
    <p class="log-hint" id="logHint">Enter to save · Shift+Enter for a new line · Esc to cancel</p>
  </form>
</dialog>

<dialog class="dlg dlg-contact" id="contactDlg" aria-labelledby="contactTitle">
  <form class="cform" id="contactForm" novalidate>
    <button type="button" class="log-cancel" data-act="contact-cancel">Cancel</button>
    <h2 class="log-title" id="contactTitle">New contact</h2>
    <div class="cform-body">
      <label class="fld"><span>Company</span><input name="org" type="text" autocomplete="off" required placeholder="Harbour Fitness"></label>
      <p class="err" id="contactErr" hidden>Add a company or a name to continue.</p>
      <div class="fld-2">
        <label class="fld"><span>Contact name</span><input name="person" type="text" autocomplete="off" placeholder="Omari Pottinger"></label>
        <label class="fld"><span>Title</span><input name="title" type="text" autocomplete="off" placeholder="Owner"></label>
      </div>
      <div class="fld-2">
        <label class="fld"><span>Industry</span><input name="industry" type="text" autocomplete="off" placeholder="Fitness"></label>
        <label class="fld"><span>Area</span><input name="area" type="text" autocomplete="off" list="areas" placeholder="Half Way Tree"></label>
      </div>
      <div class="fld-2">
        <label class="fld"><span>Phone</span><input name="phone" type="tel" autocomplete="off" inputmode="tel" placeholder="876-555-0142"></label>
        <label class="fld"><span>Website</span><input name="website" type="text" autocomplete="off" placeholder="harbourfitness.com"></label>
      </div>
      <div class="fld-2">
        <label class="fld"><span>Owner</span><select name="owner"><option value="you">You</option><option value="daniel">Daniel Brooks</option><option value="maya">Maya Chen</option><option value="andre">Andre Grant</option></select></label>
        <label class="fld"><span>Priority</span><select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
      </div>
      <datalist id="areas"></datalist>
    </div>
    <button type="submit" class="btn-primary log-save" id="contactSave">Add contact</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/prototypes/followup/data.js"></script>
<script src="/prototypes/followup/app.js"></script>
</body>
</html>
